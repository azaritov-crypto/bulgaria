<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NativeCall · Клиент-сервис · България</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f3d1f; --ink2:#2f5e3c; --muted:#5d7f66;
  --g:#1f9d47; --g2:#34c15d; --g3:#bfe8c6; --lime:#c9f27a;
  --card:#ffffff; --bg1:#f1faee; --bg2:#dcf2d6;
  --r:34px;
  --sh:0 18px 50px -20px rgba(31,90,45,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Manrope",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 85% 20%,#e4f7dc 0%,transparent 60%),
             radial-gradient(900px 600px at 10% 100%,#e9f8e4 0%,transparent 60%),
             linear-gradient(135deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:"Unbounded","Manrope",system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* decorative sparkles */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco i{position:absolute;color:var(--g2);opacity:.55;font-style:normal;animation:tw 4s ease-in-out infinite}
.deco b{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--g2);opacity:.35}
@keyframes tw{50%{opacity:.15;transform:scale(.7) rotate(20deg)}}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;
  padding:22px clamp(18px,3.5vw,56px);backdrop-filter:blur(10px);
  background:linear-gradient(to bottom,rgba(241,250,238,.92),rgba(241,250,238,.55))}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.2em;
  font-size:13px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.brand img{width:40px;height:40px;border-radius:50%}
.dots{display:flex;gap:8px;margin-left:auto}
.dots span{width:38px;height:7px;border-radius:9px;background:#cfe8cf;transition:.35s}
.dots span.on{background:var(--g)}
.tabs{display:flex;gap:6px;background:var(--ink);padding:6px;border-radius:999px}
.tabs button{color:#cfe9d4;padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;transition:.25s}
.tabs button.on{background:var(--g2);color:#fff}

/* pages */
.page{display:none;position:relative;z-index:1}
.page.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

/* ---------- PRESENTATION ---------- */
.deck{position:relative;min-height:calc(100vh - 86px)}
.slide{display:none;padding:10px clamp(18px,3.5vw,56px) 120px;min-height:calc(100vh - 86px)}
.slide.on{display:block;animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}}
.pill{display:inline-block;background:var(--g);color:#fff;font-weight:800;letter-spacing:.12em;
  padding:12px 26px;border-radius:999px;font-size:15px;text-transform:uppercase}
.slide h1{font-size:clamp(34px,5.4vw,82px);line-height:1.02;margin:22px 0 18px;font-weight:800;color:var(--ink)}
.slide h1 em{font-style:normal;color:var(--g)}
.lead{font-size:clamp(18px,1.9vw,30px);color:var(--ink2);font-weight:600;max-width:900px;line-height:1.35}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:center;margin-top:34px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.stat{background:var(--card);border-radius:var(--r);padding:26px 14px;text-align:center;box-shadow:var(--sh)}
.stat .n{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,3vw,48px);line-height:1}
.stat .l{margin-top:12px;color:var(--g);font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.card{background:var(--card);border-radius:var(--r);padding:34px 32px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card .k{color:var(--g);font-weight:800;letter-spacing:.16em;font-size:13px;text-transform:uppercase}
.card h3{font-size:clamp(20px,1.9vw,30px);line-height:1.1;margin:12px 0 14px;font-weight:700}
.card p{font-size:clamp(16px,1.35vw,21px);color:var(--ink2);line-height:1.45;font-weight:600}
.card.dark{background:var(--ink);color:#fff}
.card.dark h3{color:#fff}.card.dark p{color:#cfe9d4}.card.dark .k{color:var(--lime)}
.card .big{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:clamp(34px,3.6vw,58px);line-height:1;margin:16px 0 8px}
.card .big small{font-size:.38em;font-weight:600;color:var(--muted);margin-left:6px}
.card.dark .big small{color:#a9d3b4}
.hero-img{width:100%;max-width:760px;justify-self:end;filter:drop-shadow(0 30px 40px rgba(31,120,60,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}

.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px;position:relative}
.step{background:var(--card);border-radius:var(--r);padding:30px;box-shadow:var(--sh);position:relative}
.step .day{display:inline-block;font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:clamp(22px,2.2vw,34px);color:var(--g)}
.step .num{position:absolute;right:24px;top:22px;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:#e6f7e8;color:var(--g);font-weight:800;font-family:"Unbounded"}
.step p{margin-top:14px;font-size:clamp(16px,1.4vw,22px);font-weight:700;color:var(--ink2);line-height:1.35}
.step.paid{background:linear-gradient(135deg,var(--g),#178a3c);color:#fff}
.step.paid .day{color:var(--lime)}.step.paid p{color:#eaffef}.step.paid .num{background:rgba(255,255,255,.18);color:#fff}
.banner{margin-top:22px;background:var(--card);border-radius:var(--r);padding:26px 32px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:18px;font-size:clamp(16px,1.5vw,22px);font-weight:700;flex-wrap:wrap}
.banner .ico{width:54px;height:54px;border-radius:18px;background:#e6f7e8;display:grid;place-items:center;font-size:26px;flex:none}
.banner b{color:var(--g)}

.cta{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;font-weight:800;
  padding:22px 34px;border-radius:999px;font-size:clamp(16px,1.5vw,21px);box-shadow:0 18px 40px -14px rgba(15,61,31,.6);
  transition:.25s;margin-top:30px}
.cta:hover{transform:translateY(-3px);background:#145a2c}
.cta .arr{width:38px;height:38px;border-radius:50%;background:var(--g2);display:grid;place-items:center}

.nav{position:fixed;right:clamp(18px,3.5vw,56px);bottom:28px;display:flex;gap:12px;z-index:15}
.nav button{width:62px;height:62px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:24px;font-weight:800;color:var(--ink);transition:.2s}
.nav button:hover{background:var(--g);color:#fff}
.nav button:disabled{opacity:.35;pointer-events:none}
.counter{position:fixed;left:clamp(18px,3.5vw,56px);bottom:40px;z-index:15;font-weight:800;color:var(--muted);letter-spacing:.14em;font-size:13px}

/* ---------- FORM ---------- */
.form-wrap{max-width:980px;margin:0 auto;padding:10px clamp(16px,3vw,32px) 110px}
.form-head{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:center}
.form-head h1{font-size:clamp(30px,4.4vw,60px);line-height:1.04;margin:20px 0 14px;font-weight:800}
.form-head img{width:100%;filter:drop-shadow(0 20px 30px rgba(31,120,60,.18))}
.progress{position:sticky;top:86px;z-index:10;background:var(--card);border-radius:999px;box-shadow:var(--sh);
  padding:14px 22px;display:flex;align-items:center;gap:16px;margin:26px 0 22px;font-weight:800;font-size:14px}
.bar{flex:1;height:10px;border-radius:9px;background:#e3f2e3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:9px;transition:width .35s}
.q{background:var(--card);border-radius:28px;padding:28px 30px;box-shadow:var(--sh);margin-bottom:18px;border:2px solid transparent;transition:.25s}
.q.err{border-color:#e5484d}
.q.done{border-color:var(--g3)}
.q .qn{color:var(--g);font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.q label.t,.q .t{display:block;font-size:clamp(17px,1.6vw,21px);font-weight:800;line-height:1.35;margin:8px 0 6px}
.q .t .req{color:#e5484d}
.q .hint{color:var(--muted);font-weight:600;font-size:15px;margin-bottom:6px}
.q input[type=text],.q input[type=email],.q input[type=number],.q textarea{
  width:100%;margin-top:10px;font:inherit;font-weight:600;font-size:17px;color:var(--ink);
  border:2px solid #dcefdc;background:#f7fcf6;border-radius:18px;padding:16px 18px;outline:none;transition:.2s;resize:vertical}
.q input:focus,.q textarea:focus{border-color:var(--g2);background:#fff;box-shadow:0 0 0 5px rgba(52,193,93,.15)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;border:2px solid #e2f1e2;background:#f9fdf8;
  cursor:pointer;font-weight:700;font-size:16px;transition:.18s;user-select:none}
.opt:hover{border-color:var(--g3);background:#f0faef}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{width:24px;height:24px;flex:none;border:2.5px solid #b7d9bc;border-radius:50%;display:grid;place-items:center;transition:.18s;background:#fff}
.opt.cb .mk{border-radius:8px}
.opt.sel{border-color:var(--g);background:#eaf8ec}
.opt.sel .mk{border-color:var(--g);background:var(--g)}
.opt.sel .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.cb.sel .mk::after{width:6px;height:11px;border-radius:0;background:none;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.errmsg{display:none;color:#e5484d;font-weight:700;font-size:14px;margin-top:10px}
.q.err .errmsg{display:block}
.submit{width:100%;justify-content:center;margin-top:10px}
.submit:disabled{opacity:.6;pointer-events:none}
.thanks{display:none;text-align:center;background:var(--card);border-radius:var(--r);padding:50px 30px;box-shadow:var(--sh);margin-top:20px}
.thanks img{width:min(420px,90%)}
.thanks h2{font-size:clamp(26px,3.4vw,44px);margin:18px 0 12px}
.thanks p{font-size:19px;font-weight:600;color:var(--ink2);line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(200px);opacity:0;background:#e5484d;color:#fff;
  font-weight:800;padding:16px 26px;border-radius:999px;z-index:50;transition:.35s;box-shadow:var(--sh);max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}


/* v2 presentation blocks */
body:not(.lang-ru) .ru, body.lang-ru .bg{display:none}
.lang{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:var(--sh)}
.lang button{padding:8px 13px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.lang button.on{background:var(--g3);color:var(--ink)}
.sec{font-size:clamp(22px,2.2vw,34px);margin:46px 0 18px;font-weight:700}
.income{display:inline-flex;align-items:center;gap:22px;background:var(--ink);color:#fff;border-radius:var(--r);padding:24px 34px 24px 24px;margin-top:28px;box-shadow:0 22px 50px -20px rgba(15,61,31,.6)}
.income .ico{width:74px;height:74px;border-radius:24px;background:rgba(201,242,122,.16);display:grid;place-items:center;font-size:38px;flex:none}
.income .k{color:var(--lime);font-weight:800;letter-spacing:.16em;font-size:13px;text-transform:uppercase}
.income .big{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:clamp(40px,4.4vw,68px);line-height:1;margin:6px 0}
.income p{color:#cfe9d4;font-weight:700;font-size:clamp(15px,1.3vw,19px)}
.card.job{margin-top:34px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:#eaf8ec;color:var(--g);border:2px solid var(--g3);
  font-weight:800;padding:12px 20px;border-radius:999px;font-size:clamp(14px,1.25vw,18px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tile{background:var(--card);border-radius:var(--r);padding:28px 30px;box-shadow:var(--sh)}
.tile .emo,.card .emo{font-size:34px;margin-bottom:10px}
.tile .k{color:var(--g);font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.tile .big,.card .big{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:clamp(32px,3.2vw,52px);line-height:1;margin:14px 0 8px;white-space:nowrap}
.tile .big small,.card .big small{font-size:.36em;font-weight:600;color:var(--muted);margin-left:8px;font-family:"Manrope",sans-serif}
.tile h4{font-size:clamp(17px,1.5vw,22px);font-weight:800;margin:12px 0 8px;line-height:1.25}
.tile p{color:var(--ink2);font-weight:600;font-size:clamp(15px,1.2vw,18px);line-height:1.45;margin-top:6px}
.tile.dark{background:var(--ink);color:#fff}.tile.dark .k{color:var(--lime)}.tile.dark p{color:#cfe9d4}
.tile.pay{text-align:center}.tile.pay h4{font-size:clamp(20px,1.8vw,26px)}
.chk{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:10px}
.chk li{position:relative;padding-left:34px;font-weight:700;font-size:clamp(15px,1.2vw,18px);line-height:1.4;color:var(--ink2)}
.chk li::before{content:"✓";position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--g);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:800}
.path{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.path .node{flex:1 1 140px;background:var(--card);border-radius:24px;padding:18px 18px;box-shadow:var(--sh);font-weight:800;
  font-size:clamp(14px,1.15vw,17px);line-height:1.3;display:flex;flex-direction:column;gap:10px}
.path .node .n{width:32px;height:32px;border-radius:50%;background:#e6f7e8;color:var(--g);display:grid;place-items:center;font-family:"Unbounded","Manrope",sans-serif;font-size:14px}
.path .node.hl{background:linear-gradient(135deg,var(--g),#178a3c);color:#fff}
.path .node.hl .n{background:rgba(255,255,255,.2);color:#fff}
.path .arrow{align-self:center;color:var(--g);font-weight:800;font-size:22px}
.cards.c2{grid-template-columns:repeat(2,1fr)}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.card.cond{display:flex;gap:20px;align-items:flex-start}
.card.cond .num{width:54px;height:54px;flex:none;border-radius:18px;background:var(--g);color:#fff;display:grid;place-items:center;font-family:"Unbounded","Manrope",sans-serif;font-weight:800;font-size:22px}
.card.cond p{font-weight:700;color:var(--ink)}
.card.dark .big small{color:#a9d3b4}
.hero-img.small{max-width:460px}
.final{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:30px}
.final .cta{margin-top:0}
.site{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:999px;padding:14px 30px;box-shadow:var(--sh);
  text-decoration:none;color:var(--g);font-weight:800;font-size:clamp(17px,1.5vw,21px)}
.site .k{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
@media (max-width:1100px){.tiles,.tiles.t3,.cards.c2{grid-template-columns:1fr 1fr}.path .arrow{display:none}}
@media (max-width:700px){.tiles,.tiles.t3,.cards.c2{grid-template-columns:1fr}.lang{display:none}
  .income{display:flex;padding:20px}.path .node{flex-basis:100%;flex-direction:row;align-items:center}.final{flex-direction:column;align-items:stretch}.site{border-radius:24px}}


.slide-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta.mini{margin-top:0;padding:12px 14px 12px 24px;font-size:15px;gap:12px}
.cta.mini .arr{width:30px;height:30px}
.slide-bottom{margin-top:40px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px 26px 26px 34px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.slide-bottom .sb-text{font-weight:800;font-size:clamp(17px,1.6vw,22px)}
.slide-bottom .cta{margin-top:0}
@media (max-width:700px){.cta.mini{padding:10px 12px 10px 18px;font-size:14px}.slide-bottom{padding:22px;flex-direction:column;align-items:stretch;text-align:center}.slide-bottom .cta{justify-content:center}}

/* responsive */
@media (max-width:1100px){
  .grid{grid-template-columns:1fr}
  .hero-img{max-width:520px;justify-self:center;order:-1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cards,.timeline{grid-template-columns:1fr}
  .dots{display:none}
}
@media (max-width:700px){
  .top{padding:14px 16px;gap:10px}
  .brand span{display:none}
  .tabs{margin-left:auto}
  .tabs button{padding:9px 13px;font-size:13px}
  .form-head{grid-template-columns:1fr}.form-head img{display:none}
  .progress{top:70px}
  .nav{left:50%;right:auto;transform:translateX(-50%);bottom:14px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);padding:6px;border-radius:999px;box-shadow:var(--sh)}
  .nav button{width:50px;height:50px;box-shadow:none}
  .counter{display:none}
  .q{padding:22px 20px}
  .card,.step{padding:26px 24px}
}
</style>
</head>
<body>

/* ---------- decorative sparkles ---------- */
(function(){
  const d=document.getElementById('deco');
  for(let i=0;i<14;i++){const s=document.createElement('i');s.textContent='✦';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${14+Math.random()*22}px;animation-delay:${Math.random()*4}s`;d.appendChild(s)}
  for(let i=0;i<16;i++){const b=document.createElement('b');
    b.style.cssText=`left:${50+Math.random()*50}%;top:${Math.random()*60}%;transform:scale(${.5+Math.random()})`;d.appendChild(b)}
})();

/* ---------- page switching ---------- */
const tabs=[...document.querySelectorAll('.tabs button')];
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='page-'+p));
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.page===p));
  document.getElementById('dots').style.visibility = p==='pres'?'visible':'hidden';
  document.getElementById('lang').style.visibility = p==='pres'?'visible':'hidden';
  if(location.hash!=='#'+p) history.replaceState(null,'','#'+p);
  window.scrollTo({top:0});
}
tabs.forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>showPage(b.dataset.goto));

/* ---------- slides ---------- */
const slides=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{const s=document.createElement('span');s.onclick=()=>go(i);s.style.cursor='pointer';dots.appendChild(s)});
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k<=cur));
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===slides.length-1;
  document.getElementById('counter').textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(!document.getElementById('page-pres').classList.contains('on'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
});
let tx=null;
document.getElementById('deck').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.getElementById('deck').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));tx=null});
go(0);

/* ---------- build form ---------- */
const form=document.getElementById('anketa');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
QUESTIONS.forEach((q,i)=>{
  const box=document.createElement('div');box.className='q';box.dataset.i=i;
  let h=`<div class="qn">Въпрос ${i+1} от ${QUESTIONS.length}</div><span class="t">${esc(q.t)} <span class="req">*</span></span>`;
  if(q.hint)h+=`<div class="hint">${esc(q.hint)}</div>`;
  const name='entry.'+q.id;
  if(q.type==='textarea')h+=`<textarea name="${name}" rows="2" placeholder="Име Презиме Фамилия"></textarea>`;
  else if(q.type==='email')h+=`<input type="email" name="${name}" placeholder="mypost@gmail.com" autocomplete="email">`;
  else if(q.type==='age')h+=`<input type="text" inputmode="numeric" name="${name}" placeholder="Например: 25">`;
  else if(q.type==='text')h+=`<input type="text" name="${name}" placeholder="Viber потребителско име или телефон">`;
  else{
    const cb=q.type==='checkbox';
    h+='<div class="opts">'+q.o.map(o=>`<label class="opt${cb?' cb':''}"><input type="${cb?'checkbox':'radio'}" name="${name}" value="${esc(o)}"><span class="mk"></span><span>${esc(o)}</span></label>`).join('')+'</div>';
  }
  h+=`<div class="errmsg">${q.type==='email'?'Моля, въведете валиден имейл.':q.type==='age'?'Моля, въведете възрастта си с число.':'Това е задължителен въпрос.'}</div>`;
  box.innerHTML=h;form.appendChild(box);
});
const btn=document.createElement('button');btn.type='submit';btn.className='cta submit';
btn.innerHTML='Изпрати анкетата <span class="arr">→</span>';form.appendChild(btn);

function value(i){
  const q=QUESTIONS[i],name='entry.'+q.id;
  if(q.type==='radio')return (form.querySelector(`[name="${name}"]:checked`)||{}).value||'';
  if(q.type==='checkbox')return [...form.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value);
  return form.querySelector(`[name="${name}"]`).value.trim();
}
function valid(i){
  const q=QUESTIONS[i],v=value(i);
  if(q.type==='checkbox')return v.length>0;
  if(!v)return false;
  if(q.type==='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if(q.type==='age')return /^\d{1,2}$/.test(v);
  return true;
}
function refresh(){
  let n=0;
  QUESTIONS.forEach((_,i)=>{const ok=valid(i);n+=ok;const b=form.children[i];b.classList.toggle('done',ok);if(ok)b.classList.remove('err')});
  document.getElementById('pcount').textContent=n+' / '+QUESTIONS.length;
  document.getElementById('pbar').style.width=(n/QUESTIONS.length*100)+'%';
}
form.addEventListener('change',e=>{
  form.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
  refresh();
});
form.addEventListener('input',refresh);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}

form.addEventListener('submit',e=>{
  e.preventDefault();
  let first=-1;
  QUESTIONS.forEach((_,i)=>{const ok=valid(i);form.children[i].classList.toggle('err',!ok);if(!ok&&first<0)first=i});
  if(first>=0){form.children[first].scrollIntoView({behavior:'smooth',block:'center'});toast('Моля, отговорете на всички задължителни въпроси');return}
  const age=parseInt(value(3),10);
  if(age<18){form.children[3].classList.add('err');form.children[3].scrollIntoView({behavior:'smooth',block:'center'});toast('За съжаление не можем да наемаме непълнолетни');return}

  btn.disabled=true;btn.firstChild.textContent='Изпращане… ';
  // Скрита форма → POST към Google Forms (отговорите автоматично падат в свързаната Google Таблица)
  const f=document.createElement('form');f.method='POST';f.action=FORM_ACTION;f.target='gf_sink';f.style.display='none';
  const add=(k,v)=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i)};
  QUESTIONS.forEach((q,i)=>{const v=value(i);(Array.isArray(v)?v:[v]).forEach(x=>add('entry.'+q.id,x))});
  add('fvv','1');add('pageHistory','0');
  document.body.appendChild(f);
  let doneFlag=false;
  const finish=()=>{if(doneFlag)return;doneFlag=true;f.remove();document.getElementById('toast').classList.remove('show');
    form.style.display='none';document.querySelector('.progress').style.display='none';
    document.getElementById('thanks').style.display='block';window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('gf_sink').onload=finish;
  setTimeout(finish,4000);
  f.submit();
});

window.addEventListener('hashchange',()=>showPage(location.hash==='#form'?'form':'pres'));
/* initial page from hash */
showPage(location.hash==='#form'?'form':'pres');
</script>
</body>
